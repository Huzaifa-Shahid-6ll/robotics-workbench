name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Check, test and package
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check source and traceability
        run: npm run check
      - name: Validate project documents and contracts
        run: |
          python -m venv .venv-validation
          .venv-validation/Scripts/python.exe -m pip install -r scripts/requirements-validation.txt
          .venv-validation/Scripts/python.exe scripts/validate_pack.py --contracts
      - name: Run software tests
        run: npm test
      - name: Build and inspect the Windows VSIX
        run: node scripts/package.mjs
      - name: Retain the inspected package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robotics-workbench-win32-x64
          path: |
            artifacts/*.vsix
            artifacts/*.vsix.sha256
          if-no-files-found: error
          retention-days: 7
